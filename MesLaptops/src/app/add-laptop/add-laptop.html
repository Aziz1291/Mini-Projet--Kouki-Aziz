<div class="container">
  <div>
    <h2>Ajouter un Laptop :</h2>
  </div>
  <form>
    <div hidden class="col-sm-2 col-md-2 col-lg-2">
      <label>ID Laptop</label>
      <input type="text" [(ngModel)]="newLaptop.idLaptop" name="idLaptop" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Marque Laptop</label>
      <input type="text" [(ngModel)]="newLaptop.brandLaptop" name="brandLaptop" class="form-control">
    </div>

    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Prix Laptop</label>
      <input type="number" [(ngModel)]="newLaptop.prixLaptop" name="prixLaptop" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Caractéristiques Laptop</label>
      <input type="text" [(ngModel)]="newLaptop.caracteristiquesLaptop" name="caracteristiquesLaptop" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Date création</label>
      <input type="date" [(ngModel)]="newLaptop.dateCreation" name="dateCreation" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Modèle</label>
      <select class="form-control form-control-lg" id="idModel" name="idModel" [(ngModel)]="newIdModel">
        @for(m of models; track m.idModel) {
          <option [value]="m.idModel"> {{m.nomModel}} </option>
        }
      </select>
    </div>

    <div class="col-sm-16 col-md-16 col-lg-16">
      <label class="mb-2">Image :</label>
      <input type="file" (change)="onImageUpload($event)" name="logo" class="form-control">
    </div>

    <div class="col-sm-16 col-md-16 col-lg-16">
      <img [src]="imagePath" class="card-img-top img-fluid rounded-start"
           style="width: 500px; height: 300px" />
    </div>

    <div class="mt-2">
      <button type="submit" (click)="addLaptop()" class="btn btn-success">Ajouter</button>
    </div>
  </form>
</div>
