<div class="container">
    <div>
      <h2>Modifier un Laptop :</h2>
    </div>
         <form>
             <div  class="col-sm-2 col-md-2 col-lg-2">
               <label >ID  Laptop</label>
               <input  readonly  type="text"  [(ngModel)]="currentLaptop.idLaptop"
                   name="idLaptop" class="form-control">
              </div>

             <div class="col-sm-4 col-md-4 col-lg-4" >
               <label >Marque Laptop</label>
               <input  type="text"[(ngModel)]= "currentLaptop.brandLaptop"
                   name="brandLaptop" class="form-control">
             </div>

             <div class="col-sm-2 col-md-2 col-lg-2">
               <label >Prix Laptop</label>
           <input type="number"   [(ngModel)]= "currentLaptop.prixLaptop"
                   name="prixLaptop" class="form-control">
             </div>

             <div class="col-sm-4 col-md-4 col-lg-4">
               <label >Caractéristiques Laptop</label>
               <input  type="text"  [(ngModel)]= "currentLaptop.caracteristiquesLaptop"
                   name="caracteristiquesLaptop" class="form-control">
             </div>

             <div class="col-sm-4 col-md-4 col-lg-4">
                 <label >Date création</label>
                <input  type="date"  [ngModel]="currentLaptop.dateCreation | date: 'yyyy-MM-dd'"
                   (ngModelChange)=" currentLaptop.dateCreation= $event"   name="dateCreation"
                   class="form-control">
             </div>

             <div class="col-sm-4 col-md-4 col-lg-4">
              <label>Modèle</label>
              <select class="form-control form-control-lg" id="idModel" name="idModel" [(ngModel)]="updatedModelId">
                @for(m of models; track m.idModel)
                {
                  <option  [value]="m.idModel">  {{m.nomModel}} </option>
                 }
             </select>

             <div class="col-sm-16 col-md-16 col-lg-16">
               <img [src]="myImage" class="card-img-top img-fluid rounded-start"  style="width: 500px; height: 300px" />
              </div>

              <div class="col-sm-16 col-md-16 col-lg-16">
                <label class="mb-2">Image :</label>
                <input type="file" (change)="onImageUpload($event)" class="form-control">
              </div>

              <div class="mt-2">
                <button type="submit" (click)="onAddImageLaptop()" class="btn btn-success">Ajouter Image</button>
              </div>


              <div class="card shadow mb-4">
                <div class="card-body">
                  <table class="table table-striped">
                    <thead>
                      <tr>
                        <th>Images</th>
                      </tr>
                    </thead>
                   @for(img of currentLaptop.images; track currentLaptop.idLaptop)
                   {
                    <tbody >
                      <tr>
                        <td><img class="card-img-top img-responsive" src="{{'data:' + img.type + ';base64,' + img.image}}"
                            style="height :50px;width:100px">
                        </td>
                        <td style="width:20%" ><a class="btn btn-danger"
                          (click)="supprimerImage(img)">Supprimer</a>
                        </td>

                      </tr>
                    </tbody>
                  }
                  </table>
                </div>
              </div>

              </div>

              <div class="mt-2">
                <button type="submit"  (click)="updateLaptop()" class="btn btn-success">Modifer</button>
              </div>
         </form>
</div>
