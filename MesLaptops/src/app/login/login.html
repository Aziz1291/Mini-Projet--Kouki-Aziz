<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="auth-wrapper">
        <div class="auth-header">
          <span class="kicker">SECURITY // ACCESS CONTROL</span>
          <h3>Connexion</h3>
          <p>Portail d'administration LaptopStore</p>
        </div>

        @if(erreur === 1) {
          <div class="alert alert-danger mb-4" role="alert">
            <strong>Erreur d'accès :</strong>
            <div>{{message}}</div>
          </div>
        }

        <form (ngSubmit)="onLoggedin()">
          <div class="form-group mb-3">
            <label for="username">Identifiant / Nom d'utilisateur</label>
            <input type="text"
                   id="username"
                   name="username"
                   class="form-control"
                   placeholder="Ex: admin"
                   [(ngModel)]="user.username"
                   autocomplete="username"
                   required>
          </div>

          <div class="form-group mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <label for="password">Mot de passe</label>
              <button type="button"
                      (click)="togglePassword()"
                      class="btn btn-link p-0 text-muted small text-decoration-none border-0"
                      tabindex="-1">
                {{showPassword ? 'Masquer' : 'Afficher'}}
              </button>
            </div>
            <input [type]="showPassword ? 'text' : 'password'"
                   [attr.type]="showPassword ? 'text' : 'password'"
                   id="password"
                   name="password"
                   placeholder="••••••••••••"
                   [(ngModel)]="user.password"
                   class="form-control font-mono"
                   autocomplete="current-password"
                   required>
          </div>

          <div class="d-grid mt-4">
            <button type="submit"
                    [disabled]="!user.username || !user.password || loading"
                    class="btn btn-primary py-2">
              @if(loading) {
                <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                Vérification en cours...
              } @else {
                Se connecter au portail
              }
            </button>
          </div>

          <!-- DEMO ACCOUNTS -->
          <div class="demo-accounts mt-4 pt-3 border-top" style="border-top-style: dashed !important;">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="text-uppercase font-mono text-muted fw-bold" style="font-size: 0.72rem; letter-spacing: 0.05em;">COMPTES DÉMO</span>
              <span class="text-muted" style="font-size: 0.75rem;">Cliquer pour remplir</span>
            </div>
            <div class="d-grid gap-2">
              <div class="d-flex justify-content-between align-items-center p-2 rounded border bg-light" style="font-size: 0.85rem;">
                <div class="d-flex flex-column text-start">
                  <span class="fw-bold text-primary" style="font-size: 0.72rem;">🛡️ ADMINISTRATEUR</span>
                  <span class="text-dark">Directeur Parc (<code>admin</code>)</span>
                </div>
                <button type="button" class="btn btn-sm btn-outline-primary py-1 px-3 fw-semibold" (click)="fillDemo('admin', '123')">Remplir</button>
              </div>
              <div class="d-flex justify-content-between align-items-center p-2 rounded border bg-light" style="font-size: 0.85rem;">
                <div class="d-flex flex-column text-start">
                  <span class="fw-bold text-success" style="font-size: 0.72rem;">👤 UTILISATEUR</span>
                  <span class="text-dark">Agent Technique (<code>user1</code>)</span>
                </div>
                <button type="button" class="btn btn-sm btn-outline-primary py-1 px-3 fw-semibold" (click)="fillDemo('user1', '123')">Remplir</button>
              </div>
            </div>
          </div>

          <p class="text-muted small text-center mt-4 mb-0">
            Nouveau collaborateur ? <a routerLink="/register">Créer un compte</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
