spring.application.name=Laptops

# ── Database ─────────────────────────────────────────────────────────────────
# Set DB_URL, DB_USERNAME, DB_PASSWORD as environment variables in production
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spring_DB?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

server.servlet.context-path=/laptops

# ── CORS ─────────────────────────────────────────────────────────────────────
# Set ALLOWED_ORIGINS to your deployed Angular URL in production
# e.g. ALLOWED_ORIGINS=https://my-app.vercel.app
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}

# ── JWT ───────────────────────────────────────────────────────────────────────
# Set JWT_SECRET in production to a long random string (min 32 chars)
app.jwt.secret=${JWT_SECRET:azizamri243@gmail.com}