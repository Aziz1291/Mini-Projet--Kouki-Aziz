spring.application.name=users-microservice

# ── Database ─────────────────────────────────────────────────────────────────
# Set DB_URL, DB_USERNAME, DB_PASSWORD as environment variables in production
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/users_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

server.servlet.context-path=/users
server.port=8081
spring.main.allow-circular-references=true

# ── CORS ─────────────────────────────────────────────────────────────────────
# Set ALLOWED_ORIGINS to your deployed Angular URL in production
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}

# ── JWT ───────────────────────────────────────────────────────────────────────
# Set JWT_SECRET in production — must match the secret in Laptops REST API
app.jwt.secret=${JWT_SECRET:azizamri243@gmail.com}

